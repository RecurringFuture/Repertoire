<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head id="projectHeadId">
    <meta charset="UTF-8"/>
    <title>Practice</title>
</head>
<header id="navigationId"></header>

<body>
<h1>Practice</h1>
<hr/>

<div class="project-layout">
    <!-- LEFT: Projects list -->
    <section class="project-left">
        <div th:if="${songs != null and !songs.isEmpty()}">
            <table>
                <thead>
                <tr>
                    <th th:text="|Total: ${total}|">Total:</th>
                </tr>
                </thead>

                <tbody>
                <tr th:if="${songs == null or songs.isEmpty()}">
                    <td class="muted">No Songs</td>
                </tr>

                <tr th:each="song, iStat : ${songs}">
                    <td>
                        <a th:href="@{/practice/song/{id}(id=${song.id})}"
                           th:text="${(iStat.index + 1) + '. '+ song.title}">
                            Song title
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div th:if="${practiceSets != null and !practiceSets.isEmpty()}">
            <br>
            <table>
                <thead>
                <tr>
                    <th>PracticeSet Title</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${practiceSets}" th:classappend="${p.id == selectedPracticeSetId} ? 'selected' : ''">
                    <td>
                        <a th:href="@{/practice/practiceSet/{id}(id=${p.id})}" th:text="${p.title}">Practice Set title</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

    <section class="project-right">
        <div th:if="${selectedSong == null}" class="muted">
            Click a song on the left to see its details.
        </div>

        <form action="#" th:if="${selectedSong != null}" th:disabled="true" th:action="@{updateSong}" th:object="${selectedSong}" method="post">
            <div class="form-grid">

                <input id="id" type="hidden" th:field="*{id}" readonly />

                <label for="title">Title</label>
                <input id="title" type="text" th:disabled="true" th:field="*{title}" />

                <label for="keyId">Key</label>
                <input id="keyId" type="text" th:disabled="true" th:field="*{key}" />

                <label for="tuningId">Tuning</label>
                <input id="tuningId" type="text" th:disabled="true" th:field="*{tuning}" />

                <label for="composer">Composer</label>
                <input id="composer" type="text" th:disabled="true" th:field="*{composer}" />

                <label for="capoId">Capo position</label>
                <input id="capoId" type="text" th:disabled="true" th:field="*{capo}" />

                <label for="genreId">Genre</label>
                <input id="genreId" type="text" th:disabled="true" th:field="*{genre}" />

                <label for="tempo">Tempo</label>
                <input id="tempo" type="text" th:disabled="true" th:field="*{tempo}" />

                <label for="duration">Duration</label>
                <input id="duration" type="text" th:disabled="true" th:field="*{duration}" />

                <label for="count">Count</label>
                <input id="count" type="number" th:disabled="true" th:field="*{count}"/>

                <label for="lastPerformedDate">Last Performed</label>
                <input id="lastPerformedDate" type="text" th:disabled="true" th:value="*{lastPerformedDate}"/>

                <input id="creationDate" type="hidden" th:value="*{creationDate}" readonly />

                <input id="modificationDate" type="hidden" th:value="*{modificationDate}" readonly /><br>

                <input type="submit" name="update" value="Update">
<!--                <input id="delete" type="submit" value="Delete" th:formaction="@{deleteSong}" />-->
            </div>
        </form>

    </section>
</div>

<footer id="footerId">Footer goes here</footer>
<div id="practiceScriptsId"></div>
</body>
</html>
