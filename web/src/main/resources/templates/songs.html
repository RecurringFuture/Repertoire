<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head id="headId">
    <meta charset="UTF-8">
    <title>Songs</title>
</head>
<body>
<div id="navigationId"></div>
    <h1>Songs</h1>
    <hr>

<div class="listbox-area">
    <div>
        <ul id="ss_elem_list" tabindex="0" role="listbox" aria-labelledby="ss_elem">
            <li th:each="song, iterStat : ${songs}" role="option">
                <span class="checkmark" aria-hidden="true" th:text="${song.title}"></span>
            </li>
        </ul>
    </div>
</div>
    <footer id="footerId"></footer>
</body>
</html>
