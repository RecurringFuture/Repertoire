<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head id="headId">
    <meta charset="UTF-8">
    <title>Songs</title>
</head>
<body>
<div >
    <header id="navigationId"></header>
    <h1>Songs</h1>
    <hr>

    <table id="tableId">
        <thead>
        <tr>
            <th> Title </th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${songs.isEmpty()}">
            <td colspan="2"> No Songs </td>
        </tr>
        <tr th:each="song : ${songs}">
            <td><a th:href="@{/song(id=${song.getId()})}"><span th:text="${song.title}"> Title </span></a></td>
        </tr>
        </tbody>
    </table>
    </div>
    <footer id="footerId">Footer goes here</footer>
</body>
</html>
