<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head id="headId">
    <meta charset="UTF-8"/>
    <title>Songs</title>
</head>
<header id="navigationId"></header>

<body>
<h1>Songs</h1>
<hr/>

<div class="song-layout">
    <!-- LEFT: Songs list -->
    <section class="song-left">

        <table>
            <thead>
            <tr th:if="${songs != null or !songs.isEmpty()}">
                <th th:text="|Total: ${total}|">Total:</th>
            </tr>
            </thead>

            <tbody>
            <tr th:if="${songs == null or songs.isEmpty()}">
                <td class="muted">No Songs</td>
            </tr>

            <tr th:each="song, iStat : ${songs}">
                <!--                <td th:text="${iStat.index + 1}"></td>-->
                <td>
                    <a th:href="@{/songs(id=${song.id})}"
                       th:text="${(iStat.index + 1) + '. '+ song.title}">
                        Song title
                    </a>
                </td>
            </tr>
            </tbody>
        </table>

        <h5>Filter</h5>

        <form id="filterFormId" action="#" th:action="@{filter}" th:object="${filterSong}"
              method="post">
            <div class="filter-form-grid">

                <label for="keyFilterId">Key</label>
                <select id="keyFilterId" th:field="*{key}" onchange="this.form.submit();">
<!--                    <option value="">Any</option>-->
                    <option th:each="key : ${filterKeys}" th:if="${!key.isEmpty()}" th:value="${filterKeys.indexOf(key)}"
                            th:text="${key}"></option>
                </select>

                <label for="tuningFilterId">Tuning</label>
                <select id="tuningFilterId" th:field="*{tuning}" onchange="this.form.submit();">
                    <option value="">Any</option>
                    <option th:each="tuning : ${filterTunings}" th:if="${tuning.title != null and !tuning.title.isEmpty()}" th:value="${tuning.id}"
                            th:text="${tuning.getTitle()}"></option>
                </select>
                <br><br>

                <label for="stateFilterId">State</label>
                <select id="stateFilterId" th:field="*{state}" onchange="this.form.submit();">
<!--                    <option value="-1">Any</option>-->
                    <option th:each="state : ${filterStates}"
                            th:if="${!state.isEmpty()}"
                            th:value="${filterStates.indexOf(state)}"
                            th:text="${state}">
                    </option>
                </select>

                <label for="capoFilterId">Capo</label>
                <select id="capoFilterId" th:field="*{capo}" onchange="this.form.submit();">
<!--                    <option value="-1">Any</option>-->
                    <option th:each="capo : ${filterCapo}" th:if="${!capo.isEmpty()}" th:value="${filterCapo.indexOf(capo)}"
                            th:text="${capo}"></option>
                </select>
            </div>
        </form>
    </section>

    <!-- RIGHT: Song details -->
    <section class="song-middle">
        <h4>Details</h4>

        <div th:if="${selectedSong == null}" class="muted">
            Click a song on the left to see its details.
        </div>

        <form action="#" th:if="${selectedSong != null}" th:action="@{updateSong}" th:object="${selectedSong}"
              method="post">
            <div class="form-grid">

                <input id="id" type="hidden" th:field="*{id}" readonly/>

                <label for="title">Title</label>
                <input id="title" type="text" th:field="*{title}"/>

                <label for="keyId">Key</label>
                <select name="keyStat" id="keyId" th:field="*{key}">
                    <option th:each="key : ${keys}" th:value="${keys.indexOf(key)}" th:text="${key}"></option>
                </select>

                <label for="tuningId">Tuning</label>
                <select id="tuningId" th:field="*{tuning}">
                    <option th:each="tuning : ${tunings}" th:value="${tuning.getId()}"
                            th:text="${tuning.getTitle()}"></option>
                </select>

                <label for="composer">Composer</label>
                <input id="composer" type="text" th:field="*{composer}"/>

                <label for="capoId">Capo position</label>
                <select id="capoId" th:field="*{capo}">
                    <option th:each="capo_position : ${capoPositions}"
                            th:value="${capoPositions.indexOf(capo_position)}" th:text="${capo_position}"></option>
                </select>

                <label for="genreId">Genre</label>
                <select id="genreId" th:field="*{genre}">tuningService
                    <option th:each="genre : ${genres}" th:value="${genre.getId()}"
                            th:text="${genre.getTitle()}"></option>
                </select>

                <label for="tempo">Tempo</label>
                <input id="tempo" type="number" min="0" th:field="*{tempo}" th:onkeypress="return (event.charCode !=8 &&
                event.charCode ==0 || (event.charCode >= 48 && event.charCode <= 57))">


                <label for="duration">Duration</label>
                <input id="duration" type="text" th:field="*{duration}"/>

                <label for="stateId">State</label>
                <select name="statName" id="stateId" th:field="*{state}">
                    <option th:each="state : ${states}" th:value="${states.indexOf(state)}" th:text="${state}"></option>
                </select>

                <label for="alert">Alert</label>
                <input class=".chk" id="alert" type="checkbox" th:checked="${alert}"/>

                <label for="periodId">Alert frequency</label>
                <select id="periodId">
                    <option th:each="p : ${thresholds}" th:text="${p}"></option>
                </select>

                <label for="count">Count</label>
                <input id="count" type="number" th:field="*{count}" readonly/>

                <label for="lastPerformedDate">Last Performed</label>
                <input id="lastPerformedDate" type="text" th:value="*{lastPerformedDate}" readonly/>

                <input id="creationDate" type="hidden" th:value="*{creationDate}" readonly/>

                <input id="modificationDate" type="hidden" th:value="*{modificationDate}" readonly/><br>

                <input type="submit" name="update" value="Update">
                <input id="delete" type="submit" value="Delete" th:formaction="@{deleteSong}"/>
            </div>
        </form>
    </section>

    <!--        <select name="keyStat" id="keyFilterId">-->
    <!--            <option th:each="key : ${filterKeys}" th:value="${filterKeys.indexOf(key)}" th:text="${key}"></option>-->
    <!--        </select>-->

    <!--        <select id="tuningFilterId">-->
    <!--            <option th:each="tuning : ${filterTunings}" th:value="${tuning.getId()}" th:text="${tuning.getTitle()}"></option>-->
    <!--        </select>-->

    <!--        <select name="statName" id="stateFilterId" >-->
    <!--            <option th:each="state : ${states}"  th:value="${states.indexOf(state)}" th:text="${state}"></option>-->
    <!--        </select>-->
    <!--    </section>-->

</div>

<footer id="footerId">Footer goes here</footer>
<div id="scriptsId"></div>
</body>
</html>
